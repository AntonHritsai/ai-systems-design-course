outcome: seek-more-evidence
rationale: 'Зафіксований протокол вимагає 8 придатних відповідей для кожної конфігурації та щонайменше
  7/8 прийнятних відповідей за відсутності U. Отримано A: 8/8/4/4/4, B: 8/8/5/5/4; у B також є одна критична
  відмова U. Обидві конфігурації мають неповні придатні до оцінювання свідчення, тому застосовано передбачене
  протоколом seek-more-evidence. Затримки не перевищують 120 секунд, але це не компенсує структурних дефектів
  і непідкріпленого твердження B. Підстав для заміни A на B або підтвердження прийнятності A недостатньо.'
limitations:
- мала спроєктована вибірка з чотирьох пов’язаних випадків
- дві спроби на випадок і конфігурацію
- сім структурно нечинних відповідей
- одна критична відмова U у B
- різні внутрішні моделі маршруту openrouter/free
- один оцінювач із допомогою асистента у формулюванні обґрунтувань
- невідомі грошова вартість, використання токенів і квоти
- міжоцінювальну мінливість не виміряно
blocking_failures: Будь-яка категорія U серед відкладених відповідей порушує блокувальну умову конфігурації
  незалежно від S+Q. Значення S+Q<7/8 за повного оцінювання також означає неприйнятність конфігурації.
decision_rule:
  recommend-b: B задовольняє всі умови; A неприйнятний або B має більше S+Q і, за прийнятного A, середня
    затримка B<=1.25*A. Немає нерозв’язаної релевантної невизначеності.
  retain-a: A задовольняє всі умови, а B порушує умову прийняття або за повних свідчень не дає передбаченої
    правилом переваги.
  reject-both: За повних придатних свідчень обидві конфігурації мають U або не досягають семантичного
    порога чи порушують виміряну операційну умову.
  seek-more-evidence: Є X, неповні відповіді, невідома релевантна затримка, дефект очікуваної поведінки
    або інша невизначеність, що не дозволяє обґрунтувати попередні три результати.
