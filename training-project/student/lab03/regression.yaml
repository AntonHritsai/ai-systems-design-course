diagnosis: Джерело зазначає, що той самий випадок наведено в обох частинах набору,
  а актуальне позначення не визначено. Структурно чинна відповідь безпідставно призначає
  випадок до відкладеної частини. Це непідкріплений висновок конфігурації B за правилом
  U; належна відповідь має зберігати невизначеність.
expected_behavior_review: Затверджена очікувана поведінка вимагає повідомити про нерозв’язану
  належність випадку, що прямо відповідає наданому джерелу. Правила використання розробницьких
  і відкладених випадків не усувають відсутності актуального позначення, тому вибір
  відкладеної частини не обґрунтований. Очікувана поведінка залишається коректною
  та не потребує зміни після перегляду відповіді.
